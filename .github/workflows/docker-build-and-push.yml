name: Build and Push Docker Image

permissions:
  id-token: write
  contents: read
  packages: write
  actions: read
  security-events: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rfc8693-external-idp-token-exchange
    tags:
      - "v*"
    paths-ignore:
      - docs/**
      - chart/**
      - .github/workflows/**

jobs:
  oss-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch tags and full commit history for branch builds.
          # This provides the VCS info required for `go build` to produce a binary that contains a
          # main module pseudo-version with a core segment relative to the most recent release tag
          # (e.g. vX.Y.(Z+1)-0.<ts>-<rev>).
          # Without the full history, branch builds generate versions like v0.0.0-<ts>-<rev>,
          # which can cause false positives in vulnerability scans.
          fetch-depth: ${{ case(github.ref_type == 'tag', 1, 0) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OSS Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest
            PROVIDERS_IMAGE=ghcr.io/mayflower/obot-providers:latest
            ENTERPRISE_PROVIDERS_IMAGE=ghcr.io/mayflower/obot-providers:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: 'v2.4.3'

      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Copy OSS image to latest tag
        if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
        run: |
          crane tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} latest

  oss-image-scan:
    runs-on: ubuntu-latest
    needs: oss-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
